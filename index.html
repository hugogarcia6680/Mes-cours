/* ---------- Fiches de révision automatiques ---------- */
const hashS=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const clip=(t,n)=>{t=t.replace(/\s+/g,' ').trim();if(t.length<=n)return t;const m=t.slice(0,n).match(/^(.*[.!?;])\s/);return (m&&m[1].length>n*.5?m[1]:t.slice(0,n).replace(/\s\S*$/,''))+'…'};
function extract(n){
 const root=document.createElement('div');root.innerHTML=n.html!=null?n.html:toHtml(n.body||'');
 const txt=el=>(el.textContent||'').replace(/\s+/g,' ').trim();
 const o={plan:[],defs:[],keys:[],warns:[],exs:[],forms:[],words:[],cloze:[],tables:[],imgs:[]};
 let cur=null;const sec=()=>{if(!cur){cur={t:'Introduction',lvl:1,pts:[]};o.plan.push(cur)}return cur};
 const seenF=new Set(),seenW=new Set();
 const addForm=(t,s)=>{t=t.trim();if(t.length>3&&t.length<160&&/[^=<>]=[^=]/.test(t)&&!seenF.has(t)){seenF.add(t);o.forms.push({t,sec:s})}};
 const words=el=>el.querySelectorAll('b,strong,u,span[style*="background"]').forEach(w=>{const k=txt(w);if(k.length>1&&k.length<60&&!seenW.has(k.toLowerCase())){seenW.add(k.toLowerCase());o.words.push(k)}});
 const cloze=(el,s)=>{const bs=[...el.querySelectorAll('b,strong,span[style*="background"]')].map(txt).filter(k=>k.length>1&&k.length<50);const full=txt(el);
  if(!bs.length||full.length>240||full.length<12)return;let q=E(full),a=E(full);bs.forEach(k=>{const r=new RegExp(E(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');q=q.replace(r,'<span class="blank">______</span>');a=a.replace(r,'<mark>'+E(k)+'</mark>')});
  if(q!=E(full))o.cloze.push({q,a,sec:s})};
 for(const el of root.children){
  const tag=el.tagName;
  if(tag=='FIGURE'){if(el.dataset.img)o.imgs.push(el.dataset.img);continue}
  if(tag=='H2'||tag=='H3'){const t=txt(el);if(t){cur={t,lvl:tag=='H2'?1:2,pts:[]};o.plan.push(cur)}continue}
  if(tag=='HR')continue;
  if(el.classList&&el.classList.contains('co')){
   const k=['def','ex','key','warn','fx'].find(c=>el.classList.contains(c)),parts=[...el.children].filter(c=>!c.classList.contains('co-t')).map(txt).filter(Boolean),body=parts.join(' ');
   if(!body)continue;const s=cur?cur.t:'';words(el);
   if(k=='def'){const m=body.match(/^(.{2,70}?)\s*(?::|：|=|–|—|\s-\s)\s*(.{3,})$/);
    o.defs.push(m?{term:m[1].trim(),def:m[2].trim(),sec:s}:{term:(el.querySelector('b,strong')&&txt(el.querySelector('b,strong')))||s||'Définition',def:body,sec:s})}
   else if(k=='key'){o.keys.push({t:body,sec:s});parts.forEach(p=>addForm(p,s))}
   else if(k=='fx')parts.forEach(p=>{p=p.trim();if(p&&!seenF.has(p)){seenF.add(p);o.forms.push({t:p,sec:s})}});
   else if(k=='warn')o.warns.push({t:body,sec:s});
   else o.exs.push({t:body,sec:s});
   continue}
  if(tag=='UL'||tag=='OL'){const check=el.classList.contains('checklist');
   [...el.querySelectorAll(':scope>li')].forEach(li=>{const t=txt(li);if(!t)return;words(li);if(check)return;addForm(t,cur?cur.t:'');
    const dm=t.match(/^(.{2,50}?)\s*:\s+(.{3,})$/);if(dm&&li.querySelector('b,strong'))o.defs.push({term:dm[1],def:dm[2],sec:cur?cur.t:''});
    sec().pts.push(clip(t,180));cloze(li,cur.t)});continue}
  if(tag=='TABLE'){o.tables.push({html:el.outerHTML,sec:cur?cur.t:''});continue}
  const t=txt(el);if(!t)continue;words(el);
  const s=cur?cur.t:'';
  if(/^(d[ée]finition|d[ée]f)\s*:/i.test(t)){const b=t.replace(/^[^:]*:\s*/,''),m=b.match(/^(.{2,60}?)\s*:\s+(.+)$/);o.defs.push(m?{term:m[1],def:m[2],sec:s}:{term:s||'Définition',def:b,sec:s});continue}
  if(/^(à retenir|retenir|important)\s*:/i.test(t)){o.keys.push({t:t.replace(/^[^:]*:\s*/,''),sec:s});continue}
  if(/^(attention|piège)\s*:/i.test(t)){o.warns.push({t:t.replace(/^[^:]*:\s*/,''),sec:s});continue}
  if(/^(ex|exemple)\s*[:.]/i.test(t)){o.exs.push({t:t.replace(/^[^:.]*[:.]\s*/,''),sec:s});continue}
  addForm(t,s);
  const dm=t.match(/^(.{2,50}?)\s*:\s+(.{3,})$/);if(dm&&el.querySelector('b,strong')&&txt(el.querySelector('b,strong')).length<=dm[1].length+2){o.defs.push({term:dm[1],def:dm[2],sec:s});continue}
  sec().pts.push(clip(t,200));cloze(el,cur.t)}
 o.plan=o.plan.filter(p=>p.pts.length||p.lvl==1||o.plan.length<12);
 return o}
function cardsFor(n){const o=extract(n),c=[];const add=(kind,q,a)=>c.push({id:hashS(kind+q),nid:n.id,kind,q,a});
 o.defs.forEach(d=>add('Définition',`Donne la définition :<br><b>${E(d.term)}</b>`,E(d.def)));
 o.forms.forEach(f=>{const i=f.t.indexOf('=');const l=f.t.slice(0,i).trim();add('Formule',l&&l.length<40?`Formule : <b>${E(l)}</b> = ?`:`Complète la formule${f.sec?' ('+E(f.sec)+')':''}`,`<span class="fx">${E(f.t)}</span>`)});
 o.keys.forEach(k=>add('À retenir',`Que faut-il retenir${k.sec?` sur <b>${E(k.sec)}</b>`:''} ?`,E(k.t)));
 o.warns.forEach(w=>add('Piège',`Quel piège éviter${w.sec?` en <b>${E(w.sec)}</b>`:''} ?`,E(w.t)));
 o.cloze.forEach(z=>add('Texte à trous',z.q,z.a));
 o.plan.filter(p=>p.pts.length>=2&&p.t!='Introduction').forEach(p=>add('Les points clés',`Cite les points importants de <b>${E(p.t)}</b>`,`<ul>${p.pts.slice(0,8).map(x=>`<li>${E(x)}</li>`).join('')}</ul>`));
 const seen=new Set();return c.filter(x=>!seen.has(x.id)&&seen.add(x.id))}
const boxOf=x=>(D.cards[x.nid]||{})[x.id]?.b||0;
function mastery(cards){if(!cards.length)return null;return Math.round(cards.reduce((s,x)=>s+Math.min(boxOf(x),3)/3,0)/cards.length*100)}
const mBar=m=>m==null?'':`<div class="mrow"><div class="mbar"><i style="width:${m}%"></i></div><span>${m}% maîtrisé</span></div>`;

function fiche(){
 const s=subOf(view.s),n=s&&s.notes.find(x=>x.id==view.n);if(!n)return go('revisions');
 const o=extract(n),cards=cardsFor(n),m=mastery(cards);
 const S=(ic,t,body,wide)=>body?`<section class="fsec card ${wide?'wide':''}"><h3>${ic} ${t}</h3>${body}</section>`:'';
 const empty=!o.defs.length&&!o.keys.length&&!o.forms.length&&!o.plan.some(p=>p.pts.length);
 M.innerHTML=`<div class="fiche-bar noprint"><button class="icon-btn" onclick="go('note','${s.id}','${n.id}')" aria-label="Retour">${ic('back')}</button><span class="rm">Revenir au cours</span><div style="flex:1"></div>
  <button class="btn ghost sm" onclick="exportPDF('fiche')">📄 PDF</button>${cards.length?`<button class="btn sm" onclick="startQuiz('${s.id}','${n.id}')">🧠 Réviser · ${cards.length} carte${cards.length>1?'s':''}</button>`:''}</div>
 <div class="print-head"><span>${s.emoji} ${E(s.name)} · Fiche de révision</span><span>${fmtT(n.date)}</span></div>
 <div class="fiche">
 <div class="fiche-h"><span class="chip hw">${s.emoji} ${E(s.name)} · Fiche de révision</span><h1 style="margin-top:8px">${E(n.title)}</h1>${mBar(m)}</div>
 ${empty?`<div class="card tip noprint">💡 Ton cours est encore peu structuré, alors la fiche reprend juste l'essentiel. Pour une fiche vraiment complète, utilise dans ton cours des <b>titres</b>, les encadrés <b>📌 Définition</b> et <b>⭐ À retenir</b>, et mets les mots importants en <b>gras</b>.</div>`:''}
 <div class="fgrid">
 ${S('⭐','L\'essentiel',o.keys.map(k=>`<div class="fkey">${k.sec?`<small>${E(k.sec)}</small>`:''}${E(k.t)}</div>`).join(''),true)}

 ${S('🧮','Formules',o.forms.map(f=>`<div class="fform">${E(f.t)}</div>`).join(''))}
 ${S('🗂️','Le cours en bref',o.plan.filter(p=>p.pts.length||p.lvl==1).map(p=>`<div class="fplan"><h4 class="${p.lvl==2?'l2':''}">${E(p.t)}</h4>${p.pts.length?`<ul>${p.pts.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:''}</div>`).join(''),true)}
 ${S('⚠️','Pièges à éviter',o.warns.map(w=>`<div class="fwarn">${E(w.t)}</div>`).join(''))}
 ${S('✏️','Exemples',o.exs.map(x=>`<div class="fex">${E(x.t)}</div>`).join(''))}

 ${S('📄','Feuilles du cours',o.imgs.length?`<div class="fimgs">${o.imgs.map(id=>`<img data-img="${id}" alt="Feuille">`).join('')}</div>`:'',true)}
 ${S('🔑','Mots-clés',o.words.length?o.words.map(w=>`<span class="kw">${E(w)}</span>`).join(''):'',true)}

function revisions(){
 const subs=D.subs.filter(s=>s.notes.length);
 M.innerHTML=`<div class="page-head"><div><h1>Révisions</h1><p class="sub">Tes fiches et tes cartes, créées automatiquement à partir de tes cours</p></div></div>
 ${subs.length?`<div class="list" style="gap:16px">${subs.map(s=>{const ns=s.notes.slice().sort((a,b)=>(b.edited||b.date)-(a.edited||a.date)),all=ns.flatMap(cardsFor),m=mastery(all);
  return `<div class="card"><div class="card-h"><h2><span class="dot" style="background:${s.color}22">${s.emoji}</span>${E(s.name)}</h2>${all.length?`<button class="btn sm" onclick="startQuiz('${s.id}')">🧠 Toute la matière · ${all.length}</button>`:''}</div>

   <button class="btn sm ghost" onclick="event.stopPropagation();go('fiche','${s.id}','${n.id}')">Fiche</button>${c.length?`<button class="btn sm" onclick="event.stopPropagation();startQuiz('${s.id}','${n.id}')">Réviser</button>`:''}<button class="icon-btn" onclick="event.stopPropagation();delNote('${s.id}','${n.id}')" aria-label="Supprimer" title="Supprimer ce cours">${ic('trash')}</button></div>`}).join('')}</div></div>`}).join('')}</div>`

/* ---------- Quiz (cartes à retourner) ---------- */
function startQuiz(sid,nid){const s=subOf(sid),ns=nid?s.notes.filter(x=>x.id==nid):s.notes;let cards=ns.flatMap(cardsFor);
 if(!cards.length){toast('Pas encore de cartes pour ce cours');return}
 cards=cards.map(c=>({c,r:boxOf(c)*10+Math.random()*8})).sort((a,b)=>a.r-b.r).map(x=>x.c).slice(0,30);
 quiz(cards,nid?ns[0].title:s.name)}
function quiz(cards,title){
 const bg=document.createElement('div');bg.className='modal-bg qz-bg';let i=0,ok=0;const miss=[];
 bg.innerHTML=`<div class="qz"><div class="qz-h"><b>🧠 ${E(title)}</b><span class="qz-n" id="qn"></span><button class="icon-btn" data-x aria-label="Fermer">${ic('x')}</button></div>
 <div class="qz-bar"><i id="qb"></i></div><div id="qbody"></div></div>`;
 document.body.appendChild(bg);closePop();const close=()=>{bg.classList.add('closing');setTimeout(()=>bg.remove(),140);if(view.v=='fiche'||view.v=='revisions'){animate=false;render()}};
 const show=()=>{const c=cards[i];$('#qn').textContent=`${i+1} / ${cards.length}`;$('#qb').style.width=(i/cards.length*100)+'%';
  $('#qbody').innerHTML=`<div class="qz-card" id="qc"><div class="qz-in"><div class="qz-f"><small>${c.kind}</small><div class="qz-q">${c.q}</div><span class="qz-tap">Touche pour voir la réponse</span></div><div class="qz-b"><small>Réponse</small><div class="qz-a">${c.a}</div></div></div></div>
  <div class="qz-btns"><button class="btn danger" data-k="0" disabled>😕 À revoir</button><button class="btn ok" data-k="1" disabled>✅ Je savais</button></div>`};
 const flip=()=>{const qc=$('#qc');if(!qc||qc.classList.contains('flip'))return;qc.classList.add('flip');bg.querySelectorAll('[data-k]').forEach(b=>b.disabled=false)};
 const answer=k=>{const c=cards[i],st=(D.cards[c.nid]=D.cards[c.nid]||{}),cur=st[c.id]?.b||0;st[c.id]={b:k?Math.min(cur+1,5):0,t:Date.now()};save();
  if(k)ok++;else miss.push(c);i++;if(i<cards.length)show();else end()};
 const end=()=>{$('#qn').textContent='';$('#qb').style.width='100%';const p=Math.round(ok/cards.length*100);
  $('#qbody').innerHTML=`<div class="qz-end"><div class="e">${p>=80?'🏆':p>=50?'💪':'📚'}</div><h2 style="justify-content:center">${ok} / ${cards.length} sues</h2><p class="rm">${p>=80?'Excellent, tu maîtrises bien ce chapitre !':p>=50?'Pas mal ! Encore un petit tour sur les cartes à revoir.':'Relis la fiche puis réessaie, ça va rentrer !'}</p>
  <div class="row-c">${miss.length?`<button class="btn" id="qagain">🔁 Revoir les ${miss.length} carte${miss.length>1?'s':''}</button>`:''}<button class="btn ghost" data-x>Terminer</button></div></div>`;
  const a=$('#qagain');if(a)a.onclick=()=>{cards=miss.splice(0);i=0;ok=0;show()}};
 bg.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.hasAttribute('data-x'))return close();if(b?.dataset.k&&!b.disabled)return answer(+b.dataset.k);if(e.target.closest('#qc'))flip()});
 bg.tabIndex=0;bg.addEventListener('keydown',e=>{if(e.key=='Escape')close();else if(e.key==' '||e.key=='Enter'){e.preventDefault();flip()}else if((e.key=='1'||e.key=='2')&&$('#qc')?.classList.contains('flip'))answer(e.key=='2'?1:0)});
 show();bg.focus()}

/* ---------- Feuilles scannées (photos rangées dans l'appareil) ---------- */
const IDB={p:null,
 open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('mescours',1);r.onupgradeneeded=()=>r.result.createObjectStore('imgs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('imgs',mode),st=tx.objectStore('imgs'),rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})},
 put(k,v){return this.run('readwrite',s=>s.put(v,k))},get(k){return this.run('readonly',s=>s.get(k))},del(k){return this.run('readwrite',s=>s.delete(k))},keys(){return this.run('readonly',s=>s.getAllKeys())}};
const IMGURL={};
async function imgURL(id){if(!IMGURL[id]){const b=await IDB.get(id).catch(()=>null);if(!b)return null;IMGURL[id]=URL.createObjectURL(b)}return IMGURL[id]}
function hydrate(root){root=root||document;const l=[...root.querySelectorAll('[data-img]')];if(root.matches&&root.matches('[data-img]'))l.push(root);l.forEach(async f=>{const img=f.tagName=='IMG'?f:f.querySelector('img');if(!img)return;const u=await imgURL(f.dataset.img);if(u)img.src=u;else img.alt='Image introuvable sur cet appareil'})}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>rej(new Error('image'));i.src=u})}
async function processImg(file,scan){
 const img=await loadImg(file),k=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
 if(scan){const sw=Math.max(8,Math.round(w/28)),sh=Math.max(8,Math.round(h/28)),sc=document.createElement('canvas');sc.width=sw;sc.height=sh;
  const sx=sc.getContext('2d');sx.imageSmoothingQuality='high';sx.drawImage(c,0,0,sw,sh);
  const bc=document.createElement('canvas');bc.width=w;bc.height=h;const bx=bc.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(sc,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data,bg=bx.getImageData(0,0,w,h).data;
  for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2],b=.299*bg[i]+.587*bg[i+1]+.114*bg[i+2];
   let v=Math.min(1,g/Math.max(b*.94,1));v=v>.93?1:Math.pow(v,1.9);v=Math.round(v*255);p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(d,0,0)}
 return new Promise(r=>c.toBlob(r,'image/jpeg',scan?.8:.84))}
async function addSheets(inp,scan){const files=[...inp.files];inp.value='';if(!files.length||!$('#ed'))return;
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 toast(files.length>1?`Traitement de ${files.length} feuilles…`:(scan?'Nettoyage de la feuille…':'Ajout de la photo…'));
 for(const f of files){try{const blob=await processImg(f,scan),id='img'+uid();await IDB.put(id,blob);
   const fig=document.createElement('figure');fig.className='sheet';fig.contentEditable='false';fig.dataset.img=id;
   fig.innerHTML=`<img alt="Feuille"><figcaption><span>${scan?'📄 Feuille':'🖼️ Photo'} · ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span><span>Touche pour agrandir</span></figcaption>`;
   restore();insertBlock(fig);hydrate(fig)}catch(e){toast('Impossible de lire cette image')}}
 upd();toast(files.length>1?`${files.length} feuilles ajoutées ✓`:(scan?'Feuille ajoutée ✓':'Photo ajoutée ✓'))}
function sheetMenu(btn){pop(btn,`<div class="lab">Ajouter une feuille</div><button class="opt" data-k="scan">📄 Scanner une feuille <small style="color:var(--muted)">noir et blanc, bien lisible</small></button><button class="opt" data-k="photo">🖼️ Ajouter une photo <small style="color:var(--muted)">en couleur</small></button>`,
 b=>$(b.dataset.k=='scan'?'#fin-scan':'#fin-photo').click())}

function openViewer(fig,editable){const id=fig.dataset.img;const v=document.createElement('div');v.className='viewer';
 v.innerHTML=`<div class="vbar"><button data-v="rot">⟳ Tourner</button><button data-v="dl">⬇︎ Enregistrer</button>${editable?'<button data-v="del">🗑️ Supprimer</button>':''}<button data-v="x">✕ Fermer</button></div><div class="vimg"><img alt="Feuille"></div><div class="vhint">Touche deux fois pour zoomer · pince pour agrandir</div>`;
 document.body.appendChild(v);const im=v.querySelector('img');imgURL(id).then(u=>{if(u)im.src=u});

   x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(i,0,0);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));await IDB.put(id,b);
   if(IMGURL[id])URL.revokeObjectURL(IMGURL[id]);delete IMGURL[id];const u=await imgURL(id);im.src=u;document.querySelectorAll(`[data-img="${id}"] img`).forEach(x=>x.src=u)}}}
document.addEventListener('click',e=>{const f=e.target.closest('figure.sheet,.fimgs [data-img]');if(!f)return;e.preventDefault();openViewer(f,!!f.closest('#ed'))});
setTimeout(async()=>{try{const used=new Set();D.subs.forEach(s=>s.notes.forEach(n=>(n.html||'').replace(/data-img="([^"]+)"/g,(m,k)=>used.add(k))));
 const ks=await IDB.keys();ks.forEach(k=>{if(!used.has(k))IDB.del(k)})}catch(e){}},10000);

/* ---------- Calculatrice ---------- */
let CS={deg:true,hist:[],ans:0,pos:null};try{Object.assign(CS,JSON.parse(localStorage.getItem('mescours-calc')||'{}'))}catch(e){}
const saveCS=()=>{try{localStorage.setItem('mescours-calc',JSON.stringify(CS))}catch(e){}};
let cExpr='',cDone=false;
const calcOpen=()=>!!$('#calc');
function fmtNum(x){if(!isFinite(x))throw new Error(isNaN(x)?'Calcul impossible':'Division par zéro');
 if(Math.abs(x)<1e-12)x=0;let s=Math.abs(x)>=1e12||(Math.abs(x)<1e-6&&x!==0)?x.toExponential(6).replace(/\.?0+e/,'e'):String(parseFloat(x.toPrecision(12)));
 return s.replace('.',',').replace(/e\+?/,' × 10^')}
function calcEval(src){
 const s=src.replace(/,/g,'.').replace(/\s+/g,'');let i=0;
 const peek=()=>s[i],eat=c=>{if(s.startsWith(c,i)){i+=c.length;return true}return false};
 const toRad=x=>CS.deg?x*Math.PI/180:x,fromRad=x=>CS.deg?x*180/Math.PI:x;
 const F={sin:x=>Math.sin(toRad(x)),cos:x=>Math.cos(toRad(x)),tan:x=>{const r=Math.tan(toRad(x));if(Math.abs(r)>1e15)throw new Error('Tangente non définie');return r},
  asin:x=>fromRad(Math.asin(x)),acos:x=>fromRad(Math.acos(x)),atan:x=>fromRad(Math.atan(x)),
  ln:x=>Math.log(x),log:x=>Math.log10(x),sqrt:Math.sqrt,'√':Math.sqrt,abs:Math.abs,exp:Math.exp};
 function expr(){let v=term();for(;;){if(eat('+'))v+=term();else if(eat('-')||eat('−'))v-=term();else return v}}
 function term(){let v=unary();for(;;){if(eat('*')||eat('×'))v*=unary();else if(eat('/')||eat('÷')){const d=unary();if(d===0)throw new Error('Division par zéro');v/=d}
  else if(i<s.length&&/[0-9.(πeA√a-z]/.test(peek())&&!/^e[0-9]/.test(s.slice(i)))v*=unary();else return v}}
 function unary(){if(eat('-')||eat('−'))return -unary();if(eat('+'))return unary();return power()}
 function power(){const b=postfix();if(eat('^')){return Math.pow(b,unary())}return b}
 function postfix(){let v=primary();for(;;){if(eat('²'))v=v*v;else if(eat('³'))v=v*v*v;else if(eat('%'))v=v/100;else if(eat('!')){if(v<0||v%1||v>170)throw new Error('Factorielle impossible');let r=1;for(let k=2;k<=v;k++)r*=k;v=r}else return v}}
 function primary(){
  if(eat('(')){const v=expr();eat(')');return v}
  const m=s.slice(i).match(/^\d*\.?\d+(?:e[+-]?\d+)?/i);if(m&&m[0]){i+=m[0].length;return parseFloat(m[0])}
  if(eat('π')||eat('pi'))return Math.PI;
  if(eat('Ans'))return CS.ans;
  for(const f of ['asin','acos','atan','sqrt','sin','cos','tan','abs','exp','ln','log','√'])if(eat(f)){const x=f=='√'&&peek()!='('?postfix():primary();const r=F[f](x);if(isNaN(r))throw new Error('Hors du domaine');return r}
  if(eat('e'))return Math.E;
  throw new Error(i>=s.length?'Expression incomplète':'Symbole inconnu « '+s[i]+' »')}
 if(!s)return null;const v=expr();if(i<s.length)throw new Error(s[i]==')'?'Parenthèse en trop':'Symbole inconnu « '+s[i]+' »');return v}
function toggleCalc(){const c=$('#calc');if(c){c.classList.add('closing');setTimeout(()=>c.remove(),190);$('#qcalc')?.classList.remove('on');return}
 const el=document.createElement('div');el.className='calc';el.id='calc';el.tabIndex=0;
 const K=[['sin','fn','sin('],['cos','fn','cos('],['tan','fn','tan('],['√','fn','√('],['x²','fn','²'],
  ['(','','('],[')','',')'],['π','','π'],['xʸ','fn','^'],['AC','cl','AC'],
  ['7','','7'],['8','','8'],['9','','9'],['÷','op','÷'],['⌫','cl','DEL'],
  ['4','','4'],['5','','5'],['6','','6'],['×','op','×'],['%','','%'],
  ['1','','1'],['2','','2'],['3','','3'],['−','op','−'],['ln','fn','ln('],
  ['0','','0'],[',','',','],['Ans','fn','Ans'],['+','op','+'],['=','eq','=']];
 el.innerHTML=`<div class="calc-h" id="calcH"><b>🧮 Calculatrice</b><button class="mode" id="cmode" title="Degrés ou radians">${CS.deg?'DEG':'RAD'}</button><button class="x" id="cx" aria-label="Fermer">✕</button></div>
 <div class="calc-d" id="cd"><div class="calc-e" id="ce"></div><div class="calc-r" id="cr">0</div></div>
 <div class="calc-hist" id="chist"></div>
 <div class="calc-k">${K.map(([l,c,v])=>`<button class="ck ${c}" data-v="${v}">${l}</button>`).join('')}</div>
 <div class="calc-ins" id="cinsw" style="display:${view.v=='note'?'':'none'}"><button id="cins">↳ Insérer dans le cours</button></div>`;
 document.body.appendChild(el);$('#qcalc')?.classList.add('on');
 if(CS.pos&&innerWidth>760){el.style.left=Math.min(Math.max(8,CS.pos[0]),innerWidth-340)+'px';el.style.top=Math.min(Math.max(8,CS.pos[1]),innerHeight-120)+'px';el.style.right='auto'}
 el.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
 el.onclick=e=>{const b=e.target.closest('button');if(!b){if(e.target.closest('#cd'))el.focus({preventScroll:true});return}
  if(b.id=='cx')return toggleCalc();if(b.id=='cmode'){CS.deg=!CS.deg;b.textContent=CS.deg?'DEG':'RAD';saveCS();calcShow();return}
  if(b.id=='cins')return calcInsert();if(b.dataset.h!=null){cExpr=b.dataset.h;cDone=false;calcShow();return}
  calcKey(b.dataset.v)};
 el.onkeydown=e=>{if(e.metaKey||e.ctrlKey)return;const k=e.key;
  if(k=='Enter'||k=='='){e.preventDefault();calcKey('=')}else if(k=='Backspace'){e.preventDefault();calcKey('DEL')}else if(k=='Escape'){toggleCalc()}
  else if(k=='Delete'){calcKey('AC')}else if(k=='*'){calcKey('×')}else if(k=='/'){e.preventDefault();calcKey('÷')}else if(k=='-'){calcKey('−')}
  else if(k.length==1&&/[0-9.,+()^%!πa-zA-Z²]/.test(k)){e.preventDefault();calcKey(k=='.'?',':k)}};
 // déplacer la calculatrice
 const h=$('#calcH');h.onpointerdown=e=>{if(e.target.closest('button')||innerWidth<=760)return;const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;h.setPointerCapture(e.pointerId);h.style.cursor='grabbing';
  h.onpointermove=ev=>{const x=Math.min(Math.max(8,ev.clientX-ox),innerWidth-r.width-8),y=Math.min(Math.max(8,ev.clientY-oy),innerHeight-80);el.style.left=x+'px';el.style.top=y+'px';el.style.right='auto'};
  h.onpointerup=()=>{h.onpointermove=null;h.style.cursor='';const r2=el.getBoundingClientRect();CS.pos=[r2.left,r2.top];saveCS()}};
 calcShow();if(view.v!='note')el.focus({preventScroll:true});
}
function calcKey(v){
 if(v=='AC'){cExpr='';cDone=false}
 else if(v=='DEL'){cExpr=cDone?'':cExpr.replace(/(sin\(|cos\(|tan\(|ln\(|log\(|√\(|Ans|.)$/,'');cDone=false}
 else if(v=='='){try{const r=calcEval(cExpr);if(r==null)return;const txt=fmtNum(r);cExpr=cExpr.replace(/Ans/g,'('+fmtNum(CS.ans)+')').replace(/^\(([^()]*)\)(?=[+−×÷^%²!])/,'$1');CS.ans=r;CS.hist=[{e:cExpr,r:txt},...CS.hist.filter(h=>h.e!=cExpr)].slice(0,8);saveCS();cDone=true;calcShow(true)}catch(err){calcShow(false,err.message)}return}
 else{if(cDone){cExpr=/^[+−×÷^%²!]/.test(v)?'Ans':'';cDone=false}cExpr+=v}
 calcShow()}
function calcShow(final,err){const ce=$('#ce'),cr=$('#cr');if(!ce)return;
 ce.innerHTML=E(cExpr)+(cDone?' =':'<span class="cur"></span>');cr.classList.remove('err','bump');
 if(err){cr.textContent=err;cr.classList.add('err');return}
 if(final){cr.textContent=fmtNum(CS.ans);void cr.offsetWidth;cr.classList.add('bump')}
 else{let prev='';try{const r=calcEval(cExpr);if(r!=null)prev=fmtNum(r)}catch(e){prev=null}
  if(prev!==null)cr.textContent=prev||'0';cr.style.opacity=prev?'.55':'1'}
 if(final)cr.style.opacity='1';
 $('#chist').innerHTML=CS.hist.map(h=>`<button data-h="${E(h.e)}" title="${E(h.e)} = ${E(h.r)}">${E(h.e)} = ${E(h.r)}</button>`).join('')}
function calcInsert(){if(!$('#ed'))return;let txt;if(cDone){cmd('insertText',`${cExpr} = ${fmtNum(CS.ans)} `);toast('Calcul inséré ✓');return}try{const r=calcEval(cExpr);if(r==null){toast('Fais un calcul d\'abord');return}txt=`${cExpr} = ${fmtNum(r)}`}catch(e){toast(e.message);return}
 cmd('insertText',txt+' ');toast('Calcul inséré ✓')}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()=='k'){e.preventDefault();go('search')}});
